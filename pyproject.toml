[project]
name = "fiap-officine-lambda"
version = "0.1.0"
description = "Serverless Function (AWS Lambda) para autenticação de clientes via CPF (status consultado no OS Service) e emissão de JWT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-jose[cryptography]>=3.3.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=src --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
relative_files = true
