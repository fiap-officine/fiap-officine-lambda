name: Deploy - Lambda Auth

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "terraform/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"

jobs:
  test-and-package:
    name: Test and Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Run Tests
        run: |
          uv sync
          uv run pytest --cov-fail-under=80

  deploy-homolog:
    name: Deploy to AWS Lambda (Homolog)
    needs: test-and-package
    # Ambiente único: homolog (projeto acadêmico) — develop e main publicam aqui
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: sa-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Build Packaging with uv
        run: |
          mkdir -p terraform/build/package
          uv pip install --target terraform/build/package --python-platform x86_64-manylinux2014 --python-version 3.12 "python-jose[cryptography]>=3.3.0"
          cp -r src/* terraform/build/package/

      - name: Deploy with Terraform (Homolog)
        working-directory: ./terraform
        env:
          TF_VAR_internal_api_token: ${{ secrets.INTERNAL_API_TOKEN }}
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
          OS_SERVICE_URL_VAR: ${{ vars.OS_SERVICE_URL }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="fiap-officine-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region sa-east-1 \
              --create-bucket-configuration LocationConstraint=sa-east-1 \
              || aws s3api head-bucket --bucket "$BUCKET"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          # URL pública do API Gateway publicada pelo fiap-officine-kubernets (variável como fallback)
          OS_SERVICE_URL=$(aws ssm get-parameter --name /fiap-officine/homolog/api-gateway/url \
            --query Parameter.Value --output text 2>/dev/null || true)
          export TF_VAR_os_service_url="${OS_SERVICE_URL:-$OS_SERVICE_URL_VAR}"
          terraform init -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=lambda/homolog/terraform.tfstate" \
            -backend-config="region=sa-east-1"
          terraform apply -input=false -auto-approve -var="environment=homolog"
